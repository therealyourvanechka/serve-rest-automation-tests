name: CI / Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Compile
        run: ./gradlew compileJava compileTestJava

  test:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get Allure history from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: allure-history
        continue-on-error: true

      - name: Run Usuarios
        run: ./gradlew test --tests "*Usuarios*"
      - name: Run Auth
        run: ./gradlew test --tests "*Auth*"
      - name: Run Produtos
        run: ./gradlew test --tests "*Produtos*"
      - name: Run Carrinhos
        run: ./gradlew test --tests "*Carrinhos*"
      - name: Run E2e
        run: ./gradlew test --tests "*E2e*"

      - name: Copy Allure history
        if: always()
        run: |
          mkdir -p build/allure-results/history
          if [ -d "allure-history/history" ]; then
            cp -r allure-history/history/* build/allure-results/history/
          fi

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport

      - name: Deploy Allure report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/allureReport
