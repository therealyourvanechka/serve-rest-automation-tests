name: CI / Allure Report

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Compile
        run: ./gradlew compileJava compileTestJava

  test:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Get Allure history from gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: allure-history
        continue-on-error: true

      - name: Clean allure-results
        run: rm -rf build/allure-results

      - name: Run Usuarios
        continue-on-error: true
        run: ./gradlew test --tests "*Usuarios*" --no-daemon
      - name: Run Auth
        continue-on-error: true
        run: ./gradlew test --tests "*Auth*" --no-daemon
      - name: Run Produtos
        continue-on-error: true
        run: ./gradlew test --tests "*Produtos*" --no-daemon
      - name: Run Carrinhos
        continue-on-error: true
        run: ./gradlew test --tests "*Carrinhos*" --no-daemon
      - name: Run E2e
        continue-on-error: true
        run: ./gradlew test --tests "*E2e*" --no-daemon

      - name: Copy Allure history
        if: always()
        run: |
          mkdir -p build/allure-results/history
          if [ -d "allure-history/history" ]; then
            cp -r allure-history/history/* build/allure-results/history/
          fi

      - name: Generate Allure report
        if: always()
        run: ./gradlew allureReport

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/allureReport

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
